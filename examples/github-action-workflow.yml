# 예시 1: GitHub Actions에서 auto-docs Action을 사용하여 Wiki 자동 배포
name: Auto Docs Wiki Generator (GitHub Action Example)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  generate-and-deploy-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      wiki: write  # GitHub Wiki push 권한 필수

    steps:
      - name: 소스코드 전체 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: auto-docs Action 실행 및 Wiki 자동 업데이트
        uses: Mireu-Lab/auto-docs@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_model: "gemma-4-26b-a4b-it"
          docs_language: "ko"
