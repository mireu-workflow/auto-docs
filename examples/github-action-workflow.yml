# Example: Auto Docs Wiki Generator in GitHub Actions
name: Auto Docs Wiki Generator (GitHub Action Example)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  generate-and-deploy-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants write access to repository and wiki

    steps:
      - name: Checkout Complete Source Code History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run auto-docs Action & Deploy Wiki
        uses: Mireu-Lab/auto-docs@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_model: "gemma-4-26b-a4b-it"
          docs_language: "en"
