name: 'auto-docs Action'
description: 'Automatically analyze repository code and generate/update GitHub/GitLab Wiki using Gemma4 AI & MCP'
inputs:
  gemini_api_key:
    description: 'Google AI Studio / Gemini API Key'
    required: true
  github_token:
    description: 'GitHub Token for Wiki repository access and deployment'
    required: false
    default: '${{ github.token }}'
  gemini_model:
    description: 'Gemini/Gemma model name to use'
    required: false
    default: 'gemma-4-26b-a4b-it'
  wiki_repo_url:
    description: 'Target Wiki Git Repository URL (optional, auto-generated if omitted)'
    required: false
  wiki_type:
    description: 'Wiki type (github or gitlab)'
    required: false
    default: 'github'
  docs_language:
    description: 'Target language for documentation (e.g. ko, en, ja)'
    required: false
    default: 'ko'
  goal_prompt:
    description: 'Goal prompt and persona for LLM doc generation'
    required: false

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
    GH_TOKEN: ${{ inputs.github_token }}
    GITHUB_REPOSITORY: ${{ github.repository }}
    GEMINI_MODEL: ${{ inputs.gemini_model }}
    WIKI_REPO_URL: ${{ inputs.wiki_repo_url }}
    WIKI_TYPE: ${{ inputs.wiki_type }}
    DOCS_LANGUAGE: ${{ inputs.docs_language }}
    GOAL_PROMPT: ${{ inputs.goal_prompt }}

