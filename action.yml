name: 'auto-docs Action'
description: 'Automatically analyze repository code and generate/update GitHub/GitLab Wiki using Gemma4 AI & MCP'
inputs:
  gemini_api_key:
    description: 'Google AI Studio / Gemini API Key'
    required: true
  gemini_model:
    description: 'Gemini/Gemma model name to use'
    required: false
    default: 'gemma-4'
  wiki_repo_url:
    description: 'Target Wiki Git Repository URL'
    required: false
  wiki_type:
    description: 'Wiki type (github or gitlab)'
    required: false
    default: 'github'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
    GEMINI_MODEL: ${{ inputs.gemini_model }}
    WIKI_REPO_URL: ${{ inputs.wiki_repo_url }}
    WIKI_TYPE: ${{ inputs.wiki_type }}
